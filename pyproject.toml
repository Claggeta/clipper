[project]
name = "clipper"
version = "0.1.0"
description = "AI-assisted tool that finds clip-worthy moments in long-form video."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av==17.0.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub<1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
clipper = "clipper.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: core errors, I: import sorting, B: likely bugs,
# UP: modern Python syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clipper --cov-report=term-missing"

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
